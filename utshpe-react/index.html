<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/images/SHPE_logo.png" />
    <link rel="apple-touch-icon" href="/assets/images/SHPE_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UT SHPE</title>
  </head>
  <body>
    <!-- the home hero is a 1440px-wide postcard scaled to the page: --k = page width / 1440 -->
    <script>(function(){function k(){document.documentElement.style.setProperty('--k',(document.documentElement.clientWidth/1440).toFixed(4))}k();addEventListener('resize',k)})()</script>
    <!-- the landing intro plays once per session on the home page (?intro forces it); decided before first paint -->
    <script>try{if(location.pathname==='/'&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&(!sessionStorage.getItem('introSeen')||location.search.indexOf('intro')>-1))document.documentElement.classList.add('introing','hideL')}catch(e){}</script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
