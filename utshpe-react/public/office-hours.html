<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeaderSHPE Office Hours — UT SHPE</title>
<script>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --burnt:#BF5700;
    --bright:#F17F13;
    --dark-orange:#8A3E00;
    --light-orange:#FFE3CB;
    --cream:#FFF7F0;
    --navy:#003A70;
    --dark-navy:#0E2244;
    --deep-navy:#16305E;
    --royal:#0B4DA2;
    --light-blue:#D6E6F5;
    --logo-blue:#76ACC6;
    --ink:#1A1A1A;
    --ink-warm:#201A15;
    --warm-gray:#4A4237;
    --rule:#E6E6E6;
    --lane:#F7F8FA;
    --page:#ECE5DD;
    --sora:'Sora', Arial, sans-serif;
    --inter:'Inter', Arial, sans-serif;
  }

  *{ box-sizing:border-box; }

  html,body{ margin:0; }

  body{
    background:var(--page);
    padding:24px 0;
    font-family:var(--inter);
    -webkit-font-smoothing:antialiased;
  }

  /* Responsive shell: keeps the 1080x1350 artboard proportional at any width. */
  .stage{
    width:min(1080px, calc(100vw - 32px));
    aspect-ratio:1080/1350;
    container-type:inline-size;
    margin:0 auto;
  }

  .art{
    position:relative;
    width:1080px;
    height:1350px;
    background:#fff;
    overflow:hidden;
    transform-origin:top left;
    /* Fallback first, for engines that reject length/length division in calc(). */
    transform:scale(tan(atan2(100cqw, 1080px)));
    transform:scale(calc(100cqw / 1080px));
  }

  /* Embed mode (?embed): the artboard fills the iframe edge to edge. */
  html.embed, html.embed body{ overflow:hidden; }
  html.embed body{ padding:0; background:#fff; }
  html.embed .stage{ width:100vw; }

  /* Landscape frame (wide screens): a 1600x1000 artboard with the logo and
     title on one row, so the schedule gets more width. */
  @media (min-aspect-ratio: 1/1){
    html.embed .stage{ aspect-ratio:1600/1000; }
    html.embed .art{
      width:1600px;
      height:1000px;
      transform:scale(tan(atan2(100cqw, 1600px)));
      transform:scale(calc(100cqw / 1600px));
    }
    html.embed .head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:40px;
      padding:36px 56px 44px;
    }
    html.embed .logo-pill{ order:2; margin-bottom:0; }
    html.embed .title{ font-size:72px; }
    html.embed .title .l1,
    html.embed .title .l2{ display:inline; }
    html.embed .lede{ margin-top:12px; }
    html.embed .grid{ top:236px; bottom:40px; }
  }

  /* ---------- Header ---------- */
  .head{
    position:relative;
    background:var(--navy);
    color:#fff;
    padding:44px 64px 40px;
  }
  .head::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:12px;
    background:var(--burnt);
  }

  .logo-pill{
    display:inline-block;
    background:#fff;
    border-radius:14px;
    padding:14px 20px;
    margin-bottom:26px;
  }
  .logo-pill img{ display:block; height:58px; width:auto; }

  .title{
    margin:0;
    font-family:var(--sora);
    font-weight:800;
    font-size:84px;
    line-height:.98;
    letter-spacing:-1.5px;
  }
  .title .l1{ display:block; color:#fff; }
  .title .l2{ display:block; color:var(--bright); }

  .lede{
    margin:18px 0 0;
    max-width:640px;
    font-family:var(--inter);
    font-size:24px;
    line-height:1.4;
    color:#CFE0F2;
  }

  /* ---------- Schedule grid ---------- */
  .grid{
    position:absolute;
    left:48px; right:48px; top:470px; bottom:48px;
    display:grid;
    grid-template-columns:92px repeat(5, 1fr);
    grid-template-rows:46px repeat(18, 1fr);
    column-gap:8px;
  }

  .lane{
    position:relative;
    z-index:0;
    background:var(--lane);
    border-radius:10px;
  }

  .line{
    position:relative;
    z-index:1;
    align-self:start;
    height:0;
    border-top:1.5px solid var(--rule);
  }
  .line.half{ border-top:1.5px dashed #EEEEEE; }

  .dayhead{
    position:relative;
    z-index:2;
    align-self:center;
    text-align:center;
    font-family:var(--sora);
    font-weight:700;
    font-size:21px;
    color:var(--navy);
  }

  .time{
    position:relative;
    z-index:2;
    grid-column:1;
    align-self:start;
    text-align:right;
    padding-right:10px;
    font-family:var(--inter);
    font-weight:600;
    font-size:19px;
    color:var(--warm-gray);
    transform:translateY(-12px);
    white-space:nowrap;
  }
  .time .mer{
    margin-left:3px;
    font-size:12px;
    color:#8A8A8A;
  }
  .time.last{
    align-self:end;
    transform:translateY(12px);
  }

  /* ---------- Officer cards ---------- */
  .card{
    position:relative;
    z-index:1;
    margin:3px 0;
    perspective:900px;
    cursor:pointer;
    --ring:0 0 #0000;
  }
  .card.s-A{ --bg:#BF5700; --fg:#FFFFFF; --sec:#FFE3CB; }
  .card.s-B{ --bg:#003A70; --fg:#FFFFFF; --sec:#CFE0F2; }
  .card.s-C{ --bg:#FFE3CB; --fg:#8A3E00; --sec:#8A3E00; }
  .card.s-D{ --bg:#D6E6F5; --fg:#003A70; --sec:#16305E; }
  .card.s-E{ --bg:#F17F13; --fg:#201A15; --sec:#201A15; }
  .card.s-F{ --bg:#76ACC6; --fg:#0E2244; --sec:#0E2244; }
  .card.s-G{ --bg:#0B4DA2; --fg:#FFFFFF; --sec:#D6E6F5; }
  .card.s-H{ --bg:#FFF7F0; --fg:#BF5700; --sec:#8A3E00; --ring:inset 0 0 0 2px #BF5700; }

  .card .inner{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.3,.7,.2,1);
  }

  .card.on{ z-index:5; }
  .card.on .inner{ transform:rotateY(180deg); }

  @media (hover:hover){
    .card:hover{ z-index:5; }
    .card:hover .inner{ transform:rotateY(180deg); }
  }

  .face{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    border-radius:12px;
    padding:6px 10px;
    overflow:hidden;
    background:var(--bg);
    box-shadow:var(--ring);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
  }

  .back{ transform:rotateY(180deg); }

  /* Front face */
  .nm{
    font-family:var(--sora);
    font-weight:700;
    font-size:23px;
    line-height:1.15;
    color:var(--fg);
  }
  .tm{
    margin-top:3px;
    font-family:var(--inter);
    font-weight:600;
    font-size:16px;
    color:var(--sec);
  }

  .sz-short .front{ flex-direction:row; gap:8px; }
  .sz-short .front .nm{ font-size:18px; }
  .sz-short .front .tm{ font-size:13px; margin-top:0; }

  /* Back face */
  .pos{
    margin-bottom:5px;
    font-family:var(--sora);
    font-weight:700;
    font-size:17px;
    line-height:1.15;
    color:var(--fg);
  }
  .yr, .mj{
    font-family:var(--inter);
    font-weight:600;
    font-size:14px;
    line-height:1.25;
    color:var(--sec);
  }
  .sz-short .pos, .sz-mid .pos{ font-size:16px; }

  /* Short and mid cards are too small for three lines, so their back pops
     out: full card width, vertically centred, floating over its neighbours. */
  .sz-short .back, .sz-mid .back{
    top:50%;
    bottom:auto;
    height:auto;
    min-height:124px;
    margin-top:-62px;
    box-shadow:var(--ring), 0 10px 28px rgba(0,58,112,.28);
  }

  .card:focus{ outline:none; }
  .card:focus-visible{ outline:none; }
  .card:focus-visible .face{
    outline:3px solid var(--bright);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion: reduce){
    .card .inner{ transition:none; }
  }
</style>
</head>

     ------------------------------------------------------------------ */

  var OFFICERS = {
    Yessenia: { style:'F', position:'President',                   year:'4th year', major:'Computer Science' },
    Carlos:   { style:'A', position:'Vice President Internal',     year:'4th year', major:'Mechanical Engineering' },
    Alex:     { style:'H', position:'Vice President External',     year:'4th year', major:'Electrical & Computer Engineering' },
    Mia:      { style:'C', position:'Secretary',                   year:'2nd year', major:'Computer Science' },
    Sophia:   { style:'D', position:'Treasurer',                   year:'4th year', major:'Mechanical Engineering' },
    Jake:     { style:'B', position:'Technical Director',          year:'3rd year', major:'Electrical & Computer Engineering' },
    Nathan:   { style:'E', position:'Professional Director',       year:'3rd year', major:'Electrical & Computer Engineering' },
    Clarissa: { style:'B', position:'Academic Director',           year:'4th year', major:'Mechanical Engineering' },
    Eliana:   { style:'C', position:'Chapter Director',            year:'3rd year', major:'Electrical & Computer Engineering' },
    Adam:     { style:'D', position:'Community Outreach Director', year:'3rd year', major:'Chemical Engineering' },
    Natalia:  { style:'G', position:'SHPEtinas Director',          year:'3rd year', major:'Civil Engineering' },
    Zoe:      { style:'E', position:'Leadership Director',         year:'2nd year', major:'Mechanical Engineering' }
  };

  var SCHEDULE = [
    { day:'Monday',    officer:'Mia',      start:10,   end:11,   label:'10–11' },
    { day:'Monday',    officer:'Carlos',   start:11.5, end:12.5, label:'11:30–12:30' },
    { day:'Monday',    officer:'Jake',     start:12.5, end:14.5, label:'12:30–2:30' },
    { day:'Monday',    officer:'Alex',     start:15,   end:17,   label:'3–5' },

    { day:'Tuesday',   officer:'Sophia',   start:10,   end:11,   label:'10–11' },
    { day:'Tuesday',   officer:'Nathan',   start:11,   end:12.5, label:'11–12:30' },
    { day:'Tuesday',   officer:'Yessenia', start:12.5, end:14.5, label:'12:30–2:30' },
    { day:'Tuesday',   officer:'Adam',     start:15,   end:16,   label:'3–4' },

    { day:'Wednesday', officer:'Mia',      start:10,   end:11,   label:'10–11' },
    { day:'Wednesday', officer:'Natalia',  start:13,   end:15,   label:'1–3' },
    { day:'Wednesday', officer:'Nathan',   start:16,   end:16.5, label:'4–4:30' },

    { day:'Thursday',  officer:'Clarissa', start:9.5,  end:11.5, label:'9:30–11:30' },
    { day:'Thursday',  officer:'Eliana',   start:11.5, end:13.5, label:'11:30–1:30' },
    { day:'Thursday',  officer:'Adam',     start:15,   end:16,   label:'3–4' },

    { day:'Friday',    officer:'Zoe',      start:9,    end:10.5, label:'9–10:30' },
    { day:'Friday',    officer:'Sophia',   start:11.5, end:12.5, label:'11:30–12:30' },
    { day:'Friday',    officer:'Carlos',   start:12.5, end:13.5, label:'12:30–1:30' },
    { day:'Friday',    officer:'Zoe',      start:15,   end:15.5, label:'3–3:30' }
  ];

  var DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
  var DAY_START = 9;   // 9:00 AM
  var DAY_END   = 18;  // 6:00 PM
  var SLOTS = (DAY_END - DAY_START) * 2; // 18 half-hour slots

  // Grid row for a decimal hour. Row 1 holds the day names.
  function rowOf(h){ return (h - DAY_START) * 2 + 2; }

  function twelveHour(h){ return h > 12 ? h - 12 : h; }
  function meridiem(h){ return h < 12 ? 'AM' : 'PM'; }

  function sizeClass(duration){
    if (duration <= 0.5) return 'sz-short';
    if (duration <= 1)   return 'sz-mid';
    return 'sz-tall';
  }

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  var grid = document.getElementById('grid');

  // 1. Day lanes (back layer).
  DAYS.forEach(function(day, i){
    var lane = el('div', 'lane');
    lane.style.gridColumn = String(i + 2);
    lane.style.gridRow = '2 / ' + (SLOTS + 2);
    lane.setAttribute('aria-hidden', 'true');
    grid.appendChild(lane);
  });

  // 2. Slot lines: solid on the hour, dashed on the half hour.
  for (var s = 0; s < SLOTS; s++){
    var line = el('div', 'line' + (s % 2 ? ' half' : ''));
    line.style.gridColumn = '2 / 7';
    line.style.gridRow = String(s + 2);
    line.setAttribute('aria-hidden', 'true');
    grid.appendChild(line);
  }

  // 3. Day headers.
  DAYS.forEach(function(day, i){
    var head = el('div', 'dayhead', day);
    head.style.gridColumn = String(i + 2);
    head.style.gridRow = '1';
    grid.appendChild(head);
  });

  // 4. Time labels on the hour, plus a closing 6:00 PM on the bottom edge.
  for (var h = DAY_START; h < DAY_END; h++){
    var t = el('div', 'time');
    t.style.gridRow = String(rowOf(h));
    t.appendChild(document.createTextNode(twelveHour(h) + ':00'));
    t.appendChild(el('span', 'mer', meridiem(h)));
    grid.appendChild(t);
  }
  var last = el('div', 'time last');
  last.style.gridRow = String(SLOTS + 1);
  last.appendChild(document.createTextNode(twelveHour(DAY_END) + ':00'));
  last.appendChild(el('span', 'mer', meridiem(DAY_END)));
  grid.appendChild(last);

  // 5. Officer cards.
  var cards = [];

  SCHEDULE.forEach(function(block){
    var who = OFFICERS[block.officer];
    if (!who) return;

    var dayIndex = DAYS.indexOf(block.day);
    if (dayIndex < 0) return;

    var card = el('div', 'card s-' + who.style + ' ' + sizeClass(block.end - block.start));
    card.style.gridColumn = String(dayIndex + 2);
    card.style.gridRow = rowOf(block.start) + ' / ' + rowOf(block.end);
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-pressed', 'false');
    card.setAttribute('aria-label',
      block.officer + ', ' + block.label + '. ' +
      who.position + ', ' + who.year + ', ' + who.major);

    var inner = el('div', 'inner');

    var front = el('div', 'face front');
    front.appendChild(el('span', 'nm', block.officer));
    front.appendChild(el('span', 'tm', block.label));

    var back = el('div', 'face back');
    back.setAttribute('aria-hidden', 'true');
    back.appendChild(el('span', 'pos', who.position));
    back.appendChild(el('span', 'yr', who.year));
    back.appendChild(el('span', 'mj', who.major));

    inner.appendChild(front);
    inner.appendChild(back);
    card.appendChild(inner);
    grid.appendChild(card);
    cards.push(card);
  });

  // 6. Flip interaction — one card open at a time.
  function setFlipped(card, on){
    card.classList.toggle('on', on);
    card.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  function toggle(card){
    var willOpen = !card.classList.contains('on');
    cards.forEach(function(other){
      if (other !== card) setFlipped(other, false);
    });
    setFlipped(card, willOpen);
  }

  cards.forEach(function(card){
    card.addEventListener('click', function(){ toggle(card); });
    card.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
        e.preventDefault();
        toggle(card);
      }
    });
  });
})();
</script>
</body>
</html>
