  <body>
    <!-- the home hero is a 1440px-wide postcard scaled to the page: --k = page width / 1440 -->
    <script>(function(){function k(){document.documentElement.style.setProperty('--k',(document.documentElement.clientWidth/1440).toFixed(4))}k();addEventListener('resize',k)})()</script>
    <!-- the landing intro plays on every load of the home page; decided before first paint. A page restored
         from the back/forward cache (Safari reopening a tab) reloads so it plays then too -->
    <script>try{if(location.pathname==='/'&&!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('introing','hideL')}catch(e){}addEventListener('pageshow',function(e){if(e.persisted&&location.pathname==='/')location.reload()})</script>
    <div id="root"></div>
  </body>
